# รันทั้งระบบในเครื่อง: docker-compose up --build -d  → เว็บ http://localhost:8080, API http://localhost:3000
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 10

  be:
    build: ./BE
    ports:
      - "3000:3000"
    env_file: BE/.env
    environment:
      DATABASE_URL: postgres://chat:chat@db:5432/chat
    depends_on:
      db:
        condition: service_healthy

  fe:
    build: ./FE
    ports:
      - "8080:80"
    environment:
      BE_URL: http://be:3000
    depends_on:
      - be

volumes:
  pgdata:
