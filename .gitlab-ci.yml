# CI/CD ของโปรเจกต์ (GitLab) — ตามแบบ Week 11
# git push ─▶ test ─▶ build + push image (Docker Hub) ─▶ scan (Trivy) ─▶ Render Deploy Hook ─▶ เว็บอัปเดต
# ขั้น build/scan/deploy ทำเฉพาะ branch หลัก (main) ส่วน branch อื่น/MR ทำแค่ test
# ใช้ needs: แยกสาย BE กับ FE ออกจากกัน → FE พังก็ไม่ขวางการ deploy BE (และกลับกัน)
#
# ตั้งค่าที่ Settings → CI/CD → Variables:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Mask), RENDER_DEPLOY_HOOK_BE (Mask), RENDER_DEPLOY_HOOK_FE (Mask)

stages:
  - test
  - build
  - scan
  - deploy

variables:
  BE_IMAGE: portfolio-be
  FE_IMAGE: portfolio-fe

# ---------- test ----------

test-be:
  stage: test
  image: node:24-alpine
  # เทสของ BE ใช้ PostgreSQL จริง → เปิด Postgres เป็น service ข้าง ๆ job
  services:
    - name: postgres:18-alpine
      alias: db
  variables:
    POSTGRES_USER: chat
    POSTGRES_PASSWORD: chat
    POSTGRES_DB: chat_test
    TEST_DATABASE_URL: postgres://chat:chat@db:5432/chat_test
  cache:
    key:
      files: [BE/package-lock.json]
    paths: [BE/.npm/]
  script:
    - cd BE
    - npm ci --cache .npm --prefer-offline
    - npm run check
    - npm test

test-fe:
  stage: test
  image: node:24-alpine
  rules:
    - exists: [FE/package.json]
  script:
    - cd FE
    - npm ci
    - npm run typecheck
    - npm run build

# ---------- build + push image ----------

.build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login
        -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build
        -t $DOCKERHUB_USERNAME/$IMAGE:latest
        -t $DOCKERHUB_USERNAME/$IMAGE:$CI_COMMIT_SHORT_SHA
        ./$DIR
    - docker push $DOCKERHUB_USERNAME/$IMAGE --all-tags

build-be:
  extends: .build-image
  needs: [test-be]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    IMAGE: $BE_IMAGE
    DIR: BE

build-fe:
  extends: .build-image
  needs: [test-fe]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [FE/package.json]
  variables:
    IMAGE: $FE_IMAGE
    DIR: FE

# ---------- scan ----------
# รายงานช่องโหว่ HIGH/CRITICAL ทั้งหมด แต่ให้ pipeline ล้มเฉพาะเมื่อเจอ CRITICAL ที่มีวิธีแก้แล้ว

.scan-image:
  stage: scan
  image:
    name: aquasec/trivy:0.58.0
    entrypoint: [""]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL
        --ignore-unfixed --no-progress
        $DOCKERHUB_USERNAME/$IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --exit-code 1 --severity CRITICAL
        --ignore-unfixed --no-progress
        $DOCKERHUB_USERNAME/$IMAGE:$CI_COMMIT_SHORT_SHA

scan-be:
  extends: .scan-image
  needs: [build-be]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    IMAGE: $BE_IMAGE

scan-fe:
  extends: .scan-image
  needs: [build-fe]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [FE/package.json]
  variables:
    IMAGE: $FE_IMAGE

# ---------- deploy ----------
# Render ตั้งเป็น "Existing Image" (docker.io/<user>/<image>:latest) — เรียก hook แล้ว Render จะดึง image ใหม่เอง

.deploy:
  stage: deploy
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]

deploy-be:
  extends: .deploy
  needs: [scan-be]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BE"

deploy-fe:
  extends: .deploy
  needs: [scan-fe]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [FE/package.json]
  script:
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK_FE"
